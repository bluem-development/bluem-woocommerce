name: CI

on:
    pull_request:
    push:
        branches:
            - master

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-test:
        runs-on: ubuntu-latest
        name: Build and unit tests (PHP ${{ matrix.php }})
        strategy:
            matrix:
                php: ['8.4', '8.5']

        steps:
            - uses: actions/checkout@v7

            - name: Create test environment file
              env:
                  BLUEM_SENDER_ID: ${{ secrets.TEST_SENDER_ID }}
                  BLUEM_TEST_ACCESS_TOKEN: ${{ secrets.TEST_ACCESS_TOKEN }}
              run: |
                  set -euo pipefail
                  BLUEM_SENDER_ID="${BLUEM_SENDER_ID:-ci-placeholder-sender}"
                  BLUEM_TEST_ACCESS_TOKEN="${BLUEM_TEST_ACCESS_TOKEN:-ci-placeholder-token}"
                  umask 077
                  {
                      printf '%s\n' 'BLUEM_ENV=test'
                      printf '%s\n' 'BLUEM_MERCHANTID=0020000387'
                      printf '%s\n' 'BLUEM_THANKSPAGE=thanks'
                      printf '%s\n' 'BLUEM_BRANDID=ExampleMandate'
                      printf '%s\n' 'BLUEM_BRANDID_PAYMENTS=ExamplePayment'
                      printf '%s\n' 'BLUEM_BRANDID_IDENTITY=ExampleIdentity'
                      printf '%s\n' 'BLUEM_BRANDID_MANDATES=ExampleMandate'
                      printf '%s\n' 'BLUEM_MERCHANTRETURNURLBASE=https://bluem.nl'
                      printf 'BLUEM_SENDER_ID=%s\n' "$BLUEM_SENDER_ID"
                      printf 'BLUEM_TEST_ACCESS_TOKEN=%s\n' "$BLUEM_TEST_ACCESS_TOKEN"
                  } > .env

            - name: Validate PHP and Composer configuration
              run: |
                  set -euo pipefail
                  find . \( -path './vendor' -o -path './build' -o -path './docker' -o -path './svn-directory' \) -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
                  composer validate --no-check-publish

            - uses: php-actions/composer@v6
              with:
                  php_version: ${{ matrix.php }}

            - name: PHPUnit Tests
              uses: php-actions/phpunit@v4
              with:
                  php_version: ${{ matrix.php }}
                  bootstrap: vendor/autoload.php
                  configuration: ./.github/workflows/phpunit.xml
            - run: echo "🍏 This job's status is ${{ job.status }}."

    hpos-integration:
        runs-on: ubuntu-latest
        name: HPOS integration (PHP 8.4)
        timeout-minutes: 20

        steps:
            - uses: actions/checkout@v7

            - uses: php-actions/composer@v6
              with:
                  php_version: 8.4

            - name: HPOS and legacy order-storage integration tests
              env:
                  WOOCOMMERCE_VERSION: 10.9.4
              run: make integration_test

            - name: Show Docker diagnostics on failure
              if: ${{ failure() }}
              run: docker ps -a

    acceptance-smoke:
        runs-on: ubuntu-latest
        name: Acceptance smoke (PHP 8.4)
        timeout-minutes: 15

        steps:
            - uses: actions/checkout@v7

            - name: Set up PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  tools: composer:v2
                  coverage: none

            - name: Install PHP dependencies
              run: composer install --no-interaction --prefer-dist

            - name: Run Dockerized acceptance smoke tests
              run: make acceptance_smoke_test

            - name: Collect acceptance diagnostics
              if: ${{ failure() }}
              run: |
                  set +e
                  mkdir -p /tmp/bluem-acceptance-diagnostics
                  docker compose ps -a > /tmp/bluem-acceptance-diagnostics/compose-ps.txt || true
                  docker compose logs --no-color > /tmp/bluem-acceptance-diagnostics/compose-logs.txt || true
                  cp -R tests/_output /tmp/bluem-acceptance-diagnostics/codeception-output 2>/dev/null || true

            - name: Upload acceptance diagnostics
              if: ${{ failure() }}
              uses: actions/upload-artifact@v4
              with:
                  name: acceptance-smoke-diagnostics
                  path: /tmp/bluem-acceptance-diagnostics
                  if-no-files-found: warn

    acceptance-settings:
        runs-on: ubuntu-latest
        name: Acceptance settings (PHP 8.4)
        timeout-minutes: 15

        steps:
            - uses: actions/checkout@v7
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  tools: composer:v2
                  coverage: none
            - run: composer install --no-interaction --prefer-dist
            - name: Run settings-flow acceptance tests
              run: make acceptance_settings_test
            - name: Collect settings diagnostics
              if: ${{ failure() }}
              run: |
                  set +e
                  mkdir -p /tmp/bluem-acceptance-settings-diagnostics
                  docker compose ps -a > /tmp/bluem-acceptance-settings-diagnostics/compose-ps.txt || true
                  docker compose logs --no-color > /tmp/bluem-acceptance-settings-diagnostics/compose-logs.txt || true
                  cp -R tests/_output /tmp/bluem-acceptance-settings-diagnostics/codeception-output 2>/dev/null || true
            - uses: actions/upload-artifact@v4
              if: ${{ failure() }}
              with:
                  name: acceptance-settings-diagnostics
                  path: /tmp/bluem-acceptance-settings-diagnostics
                  if-no-files-found: warn

    acceptance-checkout:
        runs-on: ubuntu-latest
        name: Acceptance checkout (PHP 8.4)
        timeout-minutes: 20

        steps:
            - uses: actions/checkout@v7
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  tools: composer:v2
                  coverage: none
            - run: composer install --no-interaction --prefer-dist
            - name: Run gateway and checkout acceptance tests
              run: make acceptance_checkout_test
            - name: Collect checkout diagnostics
              if: ${{ failure() }}
              run: |
                  set +e
                  mkdir -p /tmp/bluem-acceptance-checkout-diagnostics
                  docker compose ps -a > /tmp/bluem-acceptance-checkout-diagnostics/compose-ps.txt || true
                  docker compose logs --no-color > /tmp/bluem-acceptance-checkout-diagnostics/compose-logs.txt || true
                  cp -R tests/_output /tmp/bluem-acceptance-checkout-diagnostics/codeception-output 2>/dev/null || true
            - uses: actions/upload-artifact@v4
              if: ${{ failure() }}
              with:
                  name: acceptance-checkout-diagnostics
                  path: /tmp/bluem-acceptance-checkout-diagnostics
                  if-no-files-found: warn

    browser-playwright:
        runs-on: ubuntu-latest
        name: Browser Playwright (PHP 8.4 setup)
        timeout-minutes: 20

        steps:
            - uses: actions/checkout@v7
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  tools: composer:v2
                  coverage: none
            - run: composer install --no-interaction --prefer-dist
            - name: Prepare WordPress site
              run: make acceptance_prepare
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
            - run: npm install --no-audit --no-fund
            - run: npx playwright install --with-deps chromium
            - name: Run Playwright browser tests
              run: npm run test:e2e
            - uses: actions/upload-artifact@v4
              if: ${{ failure() }}
              with:
                  name: playwright-report
                  path: |
                      playwright-report
                      test-results
                  if-no-files-found: warn
